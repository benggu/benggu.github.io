<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benggu's Profile</title>
    <style>
        @font-face {
            font-family: "ch";
            src: url("assets/ch.otf");
        }
        body{
            background:black;
            font-family:"ch",Helvetica,Arial,sans-serif;
            font-size: 15px;
            line-height: 1.6;
        }
        .container{
            background: #717f6c url("/assets/worn-dots.png");
            max-width:700px;
            box-sizing: border-box;
            padding:20px;
            margin: auto;
        }
        #profile-picture{
            display:block;
            width:200px;
            margin: auto;
            border-radius: 4px;
            border:1px solid black;
            box-shadow: 0 0 5px rgba(0,0,0,0.4);
            transition:all .9s linear;
        }
        #profile-table{
            padding:10px;
            margin: auto;
        }
        #profile-table th, td{
            padding:4px;
        }
        #profile-table th{
            text-align: left;
        }


        .frame{
            background:rgb(0, 75, 128);
            color:rgb(186, 221, 222);
            padding:10px;
            box-sizing: border-box;
            border: 10px solid;
            border-image: url(/assets/frame3.png) 10 round;
            padding: 5px;
            margin: 5px;
            }
        .center{
            text-align: center;
            margin: auto;
        }
        .float-left{
            float:left;
        }
        .divider{
            clear: both;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="center">
            <h1>
                microbenggu
            </h1>
            <div style="display:flex;gap:20px;">
                <div class="frame">
                    <img src="/assets/ravenjellyfish.png" alt="Benggu's profile picture" id="profile-picture">
                    <table id="profile-table">
                        <tr>
                            <th>Name</th>
                            <td>Benggu</td>
                        </tr>
                        <tr>
                            <th>Pronouns</th>
                            <td>She/Her</td>
                        </tr>
                        <tr>
                            <th>Age</th>
                            <td>18</td>
                        </tr>
                        <tr>
                            <th>Title</th>
                            <td>Professional Amateur</td>
                        </tr>
                    </table>
                </div>
                <div class="frame">
                    <p>
                        Hi, I'm Benggu. Welcome to my profile. I made this thing for fun and giggles.
                    </p>
                </div>
            </div>
            <div class="divider"></div>
        </div>
    </div>
</body>
</html>
