<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benggu's Profile</title>
    <style>
        @font-face {
            font-family: "ch";
            src: url("assets/ch.otf");
        }
        body{
            background:black;
            font-family:"ch",Helvetica,Arial,sans-serif;
            font-size: 15px;
            line-height: 1.6;
        }
        .container{
            background: #3f2e1f url("/assets/black-linen.png");
            color:#d4b886;
            max-width:700px;
            box-sizing: border-box;
            padding:20px;
            margin: auto;
            border: 10px solid;
            border-image: url("/assets/frame3.png") 10 round;
        }
        #profile-picture{
            display:block;
            width:200px;
            margin: auto;
            border-radius: 4px;
            border:1px solid black;
            box-shadow: 0 0 5px rgba(0,0,0,0.4);
            transition:all .9s linear;
        }
        #profile-table{
            padding:10px;
            margin: auto;
        }
        #profile-table th, td{
            padding:4px;
        }
        #profile-table th{
            text-align: left;
        }


        .frame{
            background:#524139 url("/assets/black-felt.png");
            border-radius: 4px;
            box-shadow:inset 2px 2px 1px rgba(255,255,255,0.1), inset -2px -2px 1px rgba(28, 0, 0, 0.5), 2px 2px 5px rgba(0,0,0,0.3);
            color:#dbc9b5;
            text-shadow: -0.7px -0.7px 0 #574127;
            padding:10px;
            box-sizing: border-box;
            }
        .center{
            text-align: center;
            margin: auto;
        }
        .float-left{
            float:left;
        }
        .divider{
            clear: both;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="center">
            <h1>
                microbenggu
            </h1>
            <div style="display:flex;gap:20px;flex-wrap: wrap;">
                <div class="frame" style="flex:2;">
                    <img src="/assets/ravenjellyfish.png" alt="Benggu's profile picture" id="profile-picture">
                    <table id="profile-table">
                        <tr>
                            <th>Name</th>
                            <td>Benggu</td>
                        </tr>
                        <tr>
                            <th>Pronouns</th>
                            <td>She/Her</td>
                        </tr>
                        <tr>
                            <th>Age</th>
                            <td>18</td>
                        </tr>
                        <tr>
                            <th>Title</th>
                            <td>Professional Amateur</td>
                        </tr>
                    </table>
                </div>
                <div class="frame" style="flex:3;">
                    <p>
                        Hi, I'm Benggu. Welcome to my profile. I made this thing for fun and giggles.
                    </p>
                </div>
            </div>
            <div class="divider"></div>
        </div>
    </div>
</body>
</html>
